services:
  
  e-wallet-backend:
    build:
      context: .

    ports:
      - "${PORT}:5000"

    env_file:
      - .env
    
    depends_on:
      - e-wallet-persistence

  e-wallet-persistence:
    image: postgres:16

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    
volumes:
  postgres_data:
